name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.scopes.outputs.code }}
      cli: ${{ steps.scopes.outputs.cli }}
      web: ${{ steps.scopes.outputs.web }}
      quality_scopes: ${{ steps.scopes.outputs.quality_scopes }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: scopes
        name: Detect affected scopes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node --experimental-strip-types scripts/affected-scopes.mts

  quality:
    name: Affected quality
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AFFECTED_SCOPES: ${{ needs.changes.outputs.quality_scopes }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install affected workspaces
        run: node --experimental-strip-types scripts/run-affected-quality.mts install "$AFFECTED_SCOPES"
      - name: Check affected workspaces
        run: node --experimental-strip-types scripts/run-affected-quality.mts check "$AFFECTED_SCOPES"

  build-cli:
    name: Build CLI
    needs: changes
    if: ${{ needs.changes.outputs.cli == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @boses/cli...
      # CLI 构建会先完整构建并嵌入 Web UI，无需再启动独立的 Web build job。
      - run: pnpm cli:build

  verify:
    name: Verify
    needs: [changes, quality, build-cli]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          CLI_RESULT: ${{ needs.build-cli.result }}
        run: |
          for result in \
            "$CHANGES_RESULT" \
            "$QUALITY_RESULT" \
            "$CLI_RESULT"; do
            if [[ "$result" != success && "$result" != skipped ]]; then
              echo "Required CI job finished with: $result"
              exit 1
            fi
          done
