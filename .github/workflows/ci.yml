name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.scopes.outputs.code }}
      cli: ${{ steps.scopes.outputs.cli }}
      desktop: ${{ steps.scopes.outputs.desktop }}
      server: ${{ steps.scopes.outputs.server }}
      quality_scopes: ${{ steps.scopes.outputs.quality_scopes }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: scopes
        name: Detect affected scopes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node --experimental-strip-types scripts/affected-scopes.mts

  quality:
    name: Affected quality
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AFFECTED_SCOPES: ${{ needs.changes.outputs.quality_scopes }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - if: needs.changes.outputs.desktop == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-electron-
      - name: Install affected workspaces
        run: node --experimental-strip-types scripts/run-affected-quality.mts install "$AFFECTED_SCOPES"
      - name: Check affected workspaces
        run: node --experimental-strip-types scripts/run-affected-quality.mts check "$AFFECTED_SCOPES"

  build-cli:
    name: Build CLI
    needs: changes
    if: ${{ needs.changes.outputs.cli == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @boses/cli...
      - run: pnpm cli:build

  build-server:
    name: Build server image
    needs: changes
    if: ${{ needs.changes.outputs.server == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64
          load: true
          tags: loci-server-ci
          cache-from: type=gha,scope=loci-server-amd64
          cache-to: type=gha,scope=loci-server-amd64,mode=min
          provenance: false
          sbom: false
      - name: Smoke-test server image
        shell: bash
        run: |
          container_id=$(docker run --detach \
            --env LOCI_ADMIN_PASSWORD=ci \
            loci-server-ci)
          cleanup() {
            docker rm --force "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=false
          for _ in {1..20}; do
            if docker exec "$container_id" node -e \
              "fetch('http://127.0.0.1:7001/health').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"; then
              ready=true
              break
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' "$container_id")" != true ]]; then
              break
            fi
            sleep 0.25
          done

          docker logs "$container_id"
          if [[ "$ready" != true ]]; then
            echo "Server container did not become healthy"
            exit 1
          fi

  build-desktop:
    name: Build desktop
    needs: changes
    if: ${{ needs.changes.outputs.desktop == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-electron-
      - run: pnpm install --frozen-lockfile --filter @loci/desktop...
      - run: pnpm build:unpack

  verify:
    name: Verify
    needs: [changes, quality, build-cli, build-server, build-desktop]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          CLI_RESULT: ${{ needs.build-cli.result }}
          SERVER_RESULT: ${{ needs.build-server.result }}
          DESKTOP_RESULT: ${{ needs.build-desktop.result }}
        run: |
          for result in \
            "$CHANGES_RESULT" \
            "$QUALITY_RESULT" \
            "$CLI_RESULT" \
            "$SERVER_RESULT" \
            "$DESKTOP_RESULT"; do
            if [[ "$result" != success && "$result" != skipped ]]; then
              echo "Required CI job finished with: $result"
              exit 1
            fi
          done
