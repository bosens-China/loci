services:
  server:
    image: ${LOCI_SERVER_IMAGE:-ghcr.io/bosens-china/loci-server:latest}
    pull_policy: always
    environment:
      LOCI_ADMIN_PASSWORD: ${LOCI_ADMIN_PASSWORD:?请设置管理员密码}
      LOCI_ADMIN_USERNAME: ${LOCI_ADMIN_USERNAME:-admin}
      LOCI_BROWSER_PROVIDER: local
      LOCI_DATA_DIR: /data
      PORT: 3000
    ports:
      - '${LOCI_SERVER_PORT:-3000}:3000'
    volumes:
      - loci-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  loci-data:
