services:
  server:
    image: ${LOCI_SERVER_IMAGE:-ghcr.io/bosens-china/loci-server:latest}
    pull_policy: always
    environment:
      LOCI_ADMIN_PASSWORD: ${LOCI_ADMIN_PASSWORD:?请设置管理员密码}
      LOCI_ADMIN_USERNAME: ${LOCI_ADMIN_USERNAME:-admin}
      LOCI_BROWSER_TOKEN: ${LOCI_BROWSER_TOKEN:?请设置浏览器访问令牌}
      LOCI_BROWSER_URL: ws://browser:3000/chromium/playwright
      LOCI_DATA_DIR: /data
      PORT: 3000
    ports:
      - '${LOCI_SERVER_PORT:-3000}:3000'
    volumes:
      - loci-data:/data
    depends_on:
      browser:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  browser:
    image: ghcr.io/browserless/chromium:v2.55.2
    environment:
      ALLOW_FILE_PROTOCOL: 'false'
      ALLOW_GET: 'false'
      CONCURRENT: 2
      CORS: 'false'
      ENABLE_DEBUGGER: 'false'
      HEALTH: 'true'
      HOST: 0.0.0.0
      MAX_CPU_PERCENT: 90
      MAX_MEMORY_PERCENT: 90
      QUEUED: 2
      TIMEOUT: 60000
      TOKEN: ${LOCI_BROWSER_TOKEN:?请设置浏览器访问令牌}
    expose:
      - '3000'
    shm_size: 2gb
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/active?token='+process.env.TOKEN).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  loci-data:
