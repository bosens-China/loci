<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title">
  <title id="title">Loci</title>
  <defs>
    <linearGradient id="page" x1="248" y1="164" x2="868" y2="916" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#F2F7FF" />
    </linearGradient>
    <linearGradient id="bookmark" x1="616" y1="152" x2="764" y2="444" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38BDF8" />
      <stop offset="1" stop-color="#1677FF" />
    </linearGradient>
  </defs>

  <!-- 底层副页：浅冰蓝，体现本地文档库叠层 -->
  <rect x="156" y="108" width="600" height="752" rx="92" fill="#DBEAFE" />

  <!-- 主文档页：清透白底 + 柔和蓝边，兼顾浅/深色背景 -->
  <rect
    x="248"
    y="164"
    width="620"
    height="752"
    rx="92"
    fill="url(#page)"
    stroke="#93C5FD"
    stroke-width="24"
  />

  <!-- 顶部嵌入式书签：象征精准定位与记忆锚点（Loci） -->
  <path
    d="M612 152h148a20 20 0 0 1 20 20v252c0 16-18 25-31 15l-53-42a16 16 0 0 0-20 0l-53 42c-13 10-31 1-31-15V172a20 20 0 0 1 20-20Z"
    fill="url(#bookmark)"
  />

  <!-- 极简文档结构线 -->
  <rect x="348" y="344" width="188" height="48" rx="24" fill="#60A5FA" />
  <rect x="348" y="556" width="416" height="48" rx="24" fill="#BFDBFE" />
  <rect x="348" y="680" width="288" height="48" rx="24" fill="#BFDBFE" />
</svg>
