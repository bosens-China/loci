<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title">
  <title id="title">Loci</title>
  <style>
    .sub-page { fill: #DBEAFE; }
    .main-page { fill: #F8FAFF; stroke: #93C5FD; }
    .line-title { fill: #60A5FA; }
    .line-body { fill: #BFDBFE; }
    @media (prefers-color-scheme: dark) {
      .sub-page { fill: #172554; }
      .main-page { fill: #1E293B; stroke: #2563EB; }
      .line-title { fill: #3B82F6; }
      .line-body { fill: #334155; }
    }
  </style>
  <defs>
    <linearGradient id="bookmark" x1="616" y1="152" x2="764" y2="444" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38BDF8" />
      <stop offset="1" stop-color="#1677FF" />
    </linearGradient>
  </defs>

  <!-- 底层副页：体现本地文档库叠层 -->
  <rect class="sub-page" x="156" y="108" width="600" height="752" rx="92" />

  <!-- 主文档页：自适应浅/深色背景 -->
  <rect
    class="main-page"
    x="248"
    y="164"
    width="620"
    height="752"
    rx="92"
    stroke-width="24"
  />

  <!-- 顶部嵌入式书签：象征精准定位与记忆锚点（Loci） -->
  <path
    d="M612 152h148a20 20 0 0 1 20 20v252c0 16-18 25-31 15l-53-42a16 16 0 0 0-20 0l-53 42c-13 10-31 1-31-15V172a20 20 0 0 1 20-20Z"
    fill="url(#bookmark)"
  />

  <!-- 极简文档结构线 -->
  <rect class="line-title" x="348" y="344" width="188" height="48" rx="24" />
  <rect class="line-body" x="348" y="556" width="416" height="48" rx="24" />
  <rect class="line-body" x="348" y="680" width="288" height="48" rx="24" />
</svg>
