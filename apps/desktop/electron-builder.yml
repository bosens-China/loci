appId: com.loci.app
productName: Loci
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  icon: resources/icon.svg
  executableName: loci
  publish:
    provider: github
    owner: bosens-China
    repo: loci
  target:
    - target: nsis
      arch: x64
nsis:
  artifactName: loci-${version}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  icon: resources/icon-mac.svg
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  target:
    - target: dmg
      arch: arm64
dmg:
  artifactName: loci-${version}.${ext}
linux:
  icon: resources/icon.svg
  executableName: loci
  publish:
    provider: github
    owner: bosens-China
    repo: loci
  syncDesktopName: true
  artifactName: loci-${version}.${ext}
  target:
    - target: AppImage
      arch: x64
  maintainer: yliu <yangboses@gmail.com>
  category: Utility
appImage:
  artifactName: loci-${version}.${ext}
npmRebuild: false
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
