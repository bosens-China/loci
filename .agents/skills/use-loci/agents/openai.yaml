interface:
  display_name: 'Loci 文档助手'
  short_description: '通过 MCP 或 CLI 使用 Loci 查找并阅读技术文档'
  default_prompt: '使用 $use-loci 查询当前问题所需的技术文档。先判断当前会话是否有 Loci MCP 工具；普通读取直接调用。长时间抓取只有在 Agent 能同时使用 MCP 原生 Progress 和 Cancellation 时才走 MCP，否则在启动前按 CLI 参考降级；完全没有工具时也按 CLI 参考在取得我的同意后安装并使用 loci mcp call。按本地文档库、云端公开目录、用户确认后的官方文档抓取顺序执行；只在规模或范围存疑时可选检查来源并决定页面上限或排除规则。'
