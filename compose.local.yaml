name: loci-local

services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      LOCI_ADMIN_PASSWORD: ${LOCI_LOCAL_ADMIN_PASSWORD:-loci-local-admin-password}
      LOCI_ADMIN_USERNAME: admin
      LOCI_BROWSER_TOKEN: ${LOCI_LOCAL_BROWSER_TOKEN:-loci-local-browser-token}
      LOCI_BROWSER_URL: ws://browser:3000/chromium/playwright
      LOCI_DATA_DIR: /data
      PORT: 3000
    ports:
      - '${LOCI_LOCAL_SERVER_PORT:-7001}:3000'
    volumes:
      - loci-local-data:/data
    depends_on:
      browser:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  browser:
    image: ghcr.io/browserless/chromium@sha256:07f6561d607b80312cc9b2500e98e40cf1eb0276fb647984fa074c96b9dd41dc
    environment:
      ALLOW_FILE_PROTOCOL: 'false'
      ALLOW_GET: 'false'
      CONCURRENT: 2
      CORS: 'false'
      ENABLE_DEBUGGER: 'false'
      HEALTH: 'true'
      HOST: 0.0.0.0
      QUEUED: 2
      TIMEOUT: 60000
      TOKEN: ${LOCI_LOCAL_BROWSER_TOKEN:-loci-local-browser-token}
    expose:
      - '3000'
    shm_size: 2gb
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/active?token='+process.env.TOKEN).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

volumes:
  loci-local-data:
