name: loci-local

services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      LOCI_ADMIN_PASSWORD: ${LOCI_LOCAL_ADMIN_PASSWORD:-loci-local-admin-password}
      LOCI_ADMIN_USERNAME: admin
      LOCI_BROWSER_PROVIDER: local
      LOCI_DATA_DIR: /data
      PORT: 3000
    ports:
      - '${LOCI_LOCAL_SERVER_PORT:-7001}:3000'
    volumes:
      - loci-local-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  loci-local-data:
